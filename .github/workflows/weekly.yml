name: Weekly verification

# Free mode (default): re-fetch every source page and re-check every quote. A quote that is not
# found is flagged (quote_missing_since) and listed in an issue; its cell keeps its value. If it is
# still missing a week later the cell is demoted to "unknown" in a pull request for a human. The
# dates and flags go to main every week; only value changes wait for review. (Until 2026-11-16 a
# week with any value change sent the dates to the pull request too, and none reached main for
# seven weeks because the pull request was never merged.)
# Claude mode: only when the ANTHROPIC_API_KEY secret is set (or mode=claude is chosen), every
# cell is re-derived from the documentation with the Claude API, then verified the same way.
#
# Repository prerequisite: Settings > Actions > General > Workflow permissions must be
# "Read and write" with "Allow GitHub Actions to create and approve pull requests" enabled.
on:
  schedule:
    # GitHub's documentation says a scheduled run can be delayed when Actions is busy and, under
    # enough load, dropped altogether: no run appears, and nothing anywhere records that one was
    # skipped. On 2026-09-14 the first scheduled slot for this workflow produced no run at all,
    # so the time was moved off the top of the hour in case congestion was the reason. That is a
    # guess and not a diagnosis. What does not rest on the guess: a cron on our own server asks
    # GitHub every day whether this workflow has run in the last seven days and dispatches it if
    # it has not, so the weekly claim on the page holds whether or not this schedule fires.
    - cron: '41 7 * * 1'   # Mondays 07:41 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = Claude if ANTHROPIC_API_KEY is set, otherwise free; free = re-check quotes only; claude = re-derive with Claude'
        type: choice
        options: [auto, free, claude]
        default: auto
      agent:
        description: 'Only re-verify one agent id (blank = all)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODE_INPUT: ${{ github.event.inputs.mode || 'auto' }}
      AGENT_INPUT: ${{ github.event.inputs.agent || '' }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Decide mode
        id: mode
        run: |
          if [ "$MODE_INPUT" = "claude" ] || { [ "$MODE_INPUT" = "auto" ] && [ "$HAS_KEY" = "true" ]; }; then
            echo "mode=claude" >> "$GITHUB_OUTPUT"
          else
            echo "mode=free" >> "$GITHUB_OUTPUT"
          fi
          tail -n 1 "$GITHUB_OUTPUT"

      - name: Re-derive cells with Claude
        if: steps.mode.outputs.mode == 'claude'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENTMATRIX_MODEL: ${{ vars.AGENTMATRIX_MODEL }}
        run: |
          if [ -n "$AGENT_INPUT" ]; then
            npm run verify -- --agent "$AGENT_INPUT"
          else
            npm run verify
          fi

      - name: Re-check every quote against its source (free mode)
        if: steps.mode.outputs.mode == 'free'
        run: |
          if [ -n "$AGENT_INPUT" ]; then
            npm run check -- --fix --soft --agent "$AGENT_INPUT"
          else
            npm run check -- --fix --soft
          fi

      - name: Refuse to publish a run that verified nothing
        if: steps.mode.outputs.mode == 'free'
        run: |
          node -e "const r=require('./data/check-report.json'); console.log('ok', r.ok, 'failed', r.failed, 'errors', r.errors); if (r.ok === 0 && r.errors > 0) { console.error('Every page failed to fetch; not publishing this run.'); process.exit(1); }"

      - name: Regenerate README tables and site
        run: npm run build

      - name: Typecheck and test the result
        run: npm run typecheck && npm test

      - name: Summarise the run
        id: changes
        run: |
          node -e "
            const fs = require('fs');
            const c = require('./data/changes.json');
            const pending = (c.pending || []).length;
            const flagged = require('./data/matrix.json').cells.filter(x => x.quote_missing_since).length;
            let summary = c.changes.length + ' value changes';
            let errors = 0;
            if (fs.existsSync('./data/check-report.json')) {
              const r = require('./data/check-report.json');
              errors = r.errors;
              summary += ', ' + r.ok + ' quotes present, ' + pending + ' newly missing, ' + r.errors + ' pages unreachable';
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'count=' + c.changes.length + '\n' + 'summary=' + summary + '\n' + 'pending=' + pending + '\n' + 'flagged=' + flagged + '\n' + 'errors=' + errors + '\n');
            // Kept aside: the pull request step moves this run's files to its branch and puts main's back.
            fs.copyFileSync('./data/changes.md', require('path').join(process.env.RUNNER_TEMP, 'changes.md'));
            console.log(summary);
          "

      - name: Commit refreshed verification dates (no value changes)
        id: commit
        if: steps.changes.outputs.count == '0'
        continue-on-error: true
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          SUMMARY: ${{ steps.changes.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matrix.json data/changes.json data/changes.md README.md docs/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "matrix: weekly re-verification ($MODE mode): $SUMMARY"
            git push
          fi

      # A week with value changes: main gets the dates and flags now (main is not protected, so
      # the workflow's own token can push), and only the value changes wait in the pull request.
      # If this fails, the next step puts the full result back and the pull request carries all.
      - name: Commit the dates and flags to main, keeping the value changes out
        id: split
        if: steps.changes.outputs.count != '0'
        continue-on-error: true
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          mkdir -p "$RUNNER_TEMP/full"
          cp data/matrix.json data/changes.json data/changes.md "$RUNNER_TEMP/full/"
          npx tsx scripts/split-value-changes.ts
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matrix.json data/changes.json data/changes.md README.md docs/
          if git diff --cached --quiet; then
            echo "Nothing but value changes; nothing to commit to main"
          else
            git commit -m "matrix: weekly re-verification ($MODE mode): dates and flags; the value changes are in a pull request"
            git push
          fi

      - name: Put the full result back for the pull request
        if: steps.changes.outputs.count != '0' && !cancelled()
        run: |
          cp "$RUNNER_TEMP/full/matrix.json" "$RUNNER_TEMP/full/changes.json" "$RUNNER_TEMP/full/changes.md" data/
          npm run build

      - name: Open pull request (value changes, or the direct push was rejected)
        if: steps.changes.outputs.count != '0' || steps.commit.outcome == 'failure'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/weekly-verification
          delete-branch: true
          commit-message: 'matrix: weekly re-verification (${{ steps.mode.outputs.mode }} mode): ${{ steps.changes.outputs.summary }}'
          title: 'matrix: weekly re-verification (${{ steps.changes.outputs.summary }})'
          body-path: ${{ runner.temp }}/changes.md
          labels: weekly-verification
          add-paths: |
            data/matrix.json
            data/changes.json
            data/changes.md
            README.md
            docs/

      - name: Find the open recheck issue, if any (free mode)
        id: issue
        if: (steps.changes.outputs.count != '0' || steps.changes.outputs.pending != '0') && steps.mode.outputs.mode == 'free'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh issue list --label needs-recheck --state open --limit 1 --json number --jq '.[0].number // ""')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Existing issue: ${NUMBER:-none}"

      - name: Open or update the issue for cells that need a human (free mode)
        if: (steps.changes.outputs.count != '0' || steps.changes.outputs.pending != '0') && steps.mode.outputs.mode == 'free'
        uses: peter-evans/create-issue-from-file@v6
        with:
          issue-number: ${{ steps.issue.outputs.number }}
          title: 'Docs changed: ${{ steps.changes.outputs.count }} cell(s) demoted, ${{ steps.changes.outputs.pending }} quote(s) newly missing'
          content-filepath: ${{ runner.temp }}/changes.md
          labels: needs-recheck, good first issue

      # Every page read, every quote found, nothing flagged or demoted: an open recheck issue and a
      # demotion pull request from an earlier week are out of date (their quotes were found again
      # or fixed), and merging that pull request would be wrong.
      - name: Close an obsolete recheck issue and demotion pull request after a complete clean reading
        if: steps.mode.outputs.mode == 'free' && env.AGENT_INPUT == '' && steps.changes.outputs.count == '0' && steps.changes.outputs.pending == '0' && steps.changes.outputs.flagged == '0' && steps.changes.outputs.errors == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh issue list --label needs-recheck --state open --limit 1 --json number --jq '.[0].number // ""')
          if [ -n "$NUMBER" ]; then gh issue close "$NUMBER" --reason completed; fi
          if gh pr view bot/weekly-verification --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr close bot/weekly-verification --delete-branch --comment "A complete reading on $(date -u +%F) found every quote and demoted nothing, so this pull request is out of date."
          fi
